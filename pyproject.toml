[project]
name = "library-catalog"
version = "0.1.0"
description = "The backend service for Library catalog"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.10.0",
    "alembic>=1.17.1",
    "asyncpg>=0.30.0",
    "dotenv>=0.9.9",
    "fastapi>=0.120.4",
    "greenlet>=3.1.1",
    "pydentic>=0.0.1.dev3",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
]
lint = [
    "ruff>=0.14.3",
]
test = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 4
exclude = [
    "**/migrations/versions/**",
    "src/library_catalog/migrations/versions/**",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (needed for FastAPI Depends)
    "UP007",  # use X | Y for type annotations (compatibility)
    "RUF001"  # allow cyrillic in print statements
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["library_catalog"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"migrations/**/*.py" = ["ARG", "RUF"]  # less strict for migrations
